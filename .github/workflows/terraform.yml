name: Terraform CI

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  terraform:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Debugging GitHub context for troubleshooting, can be commented out when not needed
      - name: Debug GitHub Context
        run: |
          echo "Ref: $GITHUB_REF"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Print GitHub OIDC Claims
        uses: github/actions-oidc-debugger@main

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::548722508417:role/GitHubTerraformReadOnly
          aws-region: eu-north-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      # Need to comment out as the plan step is failing due to missing provider credentials. 
      # This will be fixed in a future PR.
      # - name: Terraform Plan
      #   run: terraform plan -input=false


      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint

      # checkov security scanning 
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          soft_fail: true

          